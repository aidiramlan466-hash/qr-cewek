<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Untuk Kamu ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Untuk Kamu ❤️</h1>

        <p class="subtitle">
            Ada sesuatu yang ingin aku sampaikan...
        </p>
        <img src="assets/foto.jpg" alt="Foto Kamu" class="photo">

        <br>

        <button id="openMessage">
            Buka Pesanku 💌
        </button>

        <div id="message" class="message">

            <p>
                Aku mungkin tidak selalu pandai mengungkapkan
                apa yang aku rasakan.
            </p>

            <br>

            <p>
                Tapi ada satu hal yang pasti...
                <br>
                <strong>aku sangat sayang padamu.</strong> ❤️
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
